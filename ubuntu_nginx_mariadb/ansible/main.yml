---
- hosts: all
  become: true
  tasks:

    - name: add to render and video groups
      ansible.builtin.user:
        name: ubuntu
        uid: 1000
        groups: ['render', 'video']
    - name: Install a .deb package from the internet using the apt module
      ansible.builtin.apt:
        update-cache: true
        name: ubuntu-gnome-desktop
        state: present
    
    # borrowing things from Franks code here https://gitlab.com/exosphere/exosphere/-/blob/master/ansible/roles/desktop-setup/tasks/main.yml?ref_type=heads
    - name: 'Automatic login enabled in GDM custom config'
      blockinfile:
        path: '/etc/gdm3/custom.conf'
        block: |
          AutomaticLoginEnable = true
          AutomaticLogin = ubuntu
        insertafter: '\[daemon\]'
    - name: 'graphical environment started on boot'
      systemd:
        name: 'graphical.target'
        enabled: 'yes'

    - name: 'graphical environment set as default systemd target'
      command: 'systemctl set-default graphical.target'

    - name: 'graphical environment isolated'
      command: 'systemctl isolate graphical.target'

    - name: copy headless desktop file to opt
      ansible.builtin.copy:
        src: files/sunshine_setup/gpu_setup.sh
        dest: /opt/gpu_setup.sh

    - name: make executable
      ansible.builtin.file:
        path: /opt/gpu_setup.sh
        mode: a+x

    - name: run setup once
      command: 'bash /opt/gpu_setup.sh'
      ignore_errors: true

    - name: grab latest sunshine 
      command: 'wget https://github.com/LizardByte/Sunshine/releases/download/v2026.428.130031/sunshine-ubuntu-22.04-amd64.deb'
    - name: install from disk
      command: 'apt install ./sunshine-ubuntu-22.04-amd64.deb -y'
    # used to work, now it errors a lot
    # - name: Install a .deb package from the internet using the apt module, install sunshine
    #   ansible.builtin.apt:
    #     deb: https://github.com/LizardByte/Sunshine/releases/download/v2026.428.130031/sunshine-ubuntu-22.04-amd64.deb
    #     state: present
    - name: make a directory for sunshine conf contents
      ansible.builtin.file:
        path: /home/ubuntu/.config/sunshine
        state: directory
      become_user: ubuntu
    - name: set sunshine configuration contents
      ansible.builtin.copy:
        src: files/sunshine_setup/sunshine.conf
        dest: /home/ubuntu/.config/sunshine/sunshine.conf
      become_user: ubuntu
    - name: make a directory
      ansible.builtin.file:
        path: /home/ubuntu/.config/systemd/user/
        state: directory
      become_user: ubuntu
    - name: copy sunshine service to user folder
      ansible.builtin.copy:
        src: files/sunshine_setup/sunshine.service
        dest: /home/ubuntu/.config/systemd/user/sunshine.service
      become_user: ubuntu
    - name: user daemon reload
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true
      become_user: ubuntu
    - name: user systemd enable sunshine
      ansible.builtin.systemd:
        scope: user
        enabled: true
        name: sunshine
      become_user: ubuntu