[defaults]
host_key_checking = False
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
pipelining = True
# ControlPersist must be shorter than shelve_gap_seconds so no live ssh
# master socket survives into the shelve step
ssh_args = -o ControlMaster=auto -o ControlPersist=30s -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
